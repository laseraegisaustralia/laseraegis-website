<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181c22"/>
      <stop offset="100%" stop-color="#0b0e12"/>
    </linearGradient>
    <style>
      .track { fill:rgba(255,255,255,0.08); }
      .bar { fill:#c9952a; }
      .bar2 { fill:rgba(255,255,255,0.35); }
      .gate { stroke:#c9952a; stroke-width:1.4; opacity:0.55; }
      .lbl { fill:rgba(255,255,255,0.4); font-family:'IBM Plex Mono'; font-size:9px; letter-spacing:0.08em; }
    </style>
  </defs>
  <rect width="400" height="260" fill="url(#g3)"/>
  <line class="gate" x1="120" y1="30" x2="120" y2="230"/>
  <line class="gate" x1="280" y1="30" x2="280" y2="230" stroke-dasharray="3 5"/>
  <text class="lbl" x="120" y="22" text-anchor="middle">CDR</text>
  <text class="lbl" x="280" y="22" text-anchor="middle">TRR</text>

  <rect class="track" x="30" y="55" width="330" height="16" rx="3"/>
  <rect class="bar" x="30" y="55" width="300" height="16" rx="3"/>

  <rect class="track" x="30" y="95" width="330" height="16" rx="3"/>
  <rect class="bar" x="30" y="95" width="230" height="16" rx="3"/>

  <rect class="track" x="30" y="135" width="330" height="16" rx="3"/>
  <rect class="bar2" x="30" y="135" width="150" height="16" rx="3"/>

  <rect class="track" x="30" y="175" width="330" height="16" rx="3"/>
  <rect class="bar2" x="30" y="175" width="70" height="16" rx="3"/>
</svg>
